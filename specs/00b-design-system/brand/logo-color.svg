<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 322" fill="none" role="img" aria-label="Bolsilludo logo">
  <title>Bolsilludo</title>
  <defs>
    <!-- Brand gradient: emerald-300 → emerald-500 → green-700 -->
    <linearGradient id="grad-b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5AEFBD"/>
      <stop offset="45%"  stop-color="#16B78C"/>
      <stop offset="100%" stop-color="#0B7A5A"/>
    </linearGradient>
    <!-- Coin radial gradient -->
    <radialGradient id="grad-coin" cx="40%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#FFE083"/>
      <stop offset="60%"  stop-color="#F4C13A"/>
      <stop offset="100%" stop-color="#C08800"/>
    </radialGradient>
    <!-- Pocket shadow -->
    <linearGradient id="grad-pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0B3A2A"/>
      <stop offset="100%" stop-color="#071E16"/>
    </linearGradient>
    <!-- Clip for coin inside pocket top -->
    <clipPath id="clip-coin">
      <rect x="95" y="185" width="70" height="30"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════
       LETTER B  (path approximation of a bold B)
       The B consists of a vertical stem + two
       rounded bumps (upper and lower semicircles)
       ═══════════════════════════════════════════ -->
  <path
    d="
      M 30 20
      L 30 302
      L 155 302
      C 210 302 240 272 240 232
      C 240 206 226 185 205 175
      C 226 163 238 142 238 116
      C 238 72 210 20 155 20
      Z
      M 85 75
      L 150 75
      C 185 75 185 158 150 158
      L 85 158
      Z
      M 85 210
      L 155 210
      C 195 210 195 300 155 300
      L 85 300
      Z
    "
    fill="url(#grad-b)"
  />

  <!-- ═══════════════════════════════════════════
       POCKET  (lower bump of the B)
       ═══════════════════════════════════════════ -->
  <!-- Pocket body -->
  <rect x="100" y="200" width="80" height="70" rx="8" fill="url(#grad-pocket)"/>
  <!-- Pocket top fold (lighter edge) -->
  <rect x="100" y="197" width="80" height="10" rx="4" fill="#0F5040"/>
  <!-- Pocket stitching lines (decorative dashes) -->
  <line x1="104" y1="204" x2="104" y2="262" stroke="#1B6B55" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="176" y1="204" x2="176" y2="262" stroke="#1B6B55" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- ═══════════════════════════════════════════
       COIN  (peeking out of the pocket top)
       ═══════════════════════════════════════════ -->
  <ellipse cx="140" cy="197" rx="28" ry="16" fill="url(#grad-coin)" clip-path="url(#clip-coin)"/>
  <ellipse cx="140" cy="197" rx="22" ry="12" fill="none" stroke="#C08800" stroke-width="1.5" clip-path="url(#clip-coin)" opacity="0.5"/>
</svg>
